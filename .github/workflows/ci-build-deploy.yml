name: Build & Deploy SHOOT // Bodycam 3D Engine

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-engine:
    name: Typecheck & Bundle 3D WebGL2 Engine + Procedural DSP Audio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Engine Dependencies
        run: npm ci

      - name: Verify TypeScript Strict Compilation
        run: npm run typecheck

      - name: Build Production WebGL2 Bundle
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
